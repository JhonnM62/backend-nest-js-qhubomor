name: CI/CD Backend Q Hubo Mor

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Parse SSH Credentials
        id: parse
        env:
          AUTH_SERVER: ${{ secrets.AUTH_SERVER }}
        run: |
          if [[ "$AUTH_SERVER" == *"@"* ]]; then
            echo "username=$(echo $AUTH_SERVER | cut -d'@' -f1)" >> $GITHUB_OUTPUT
            echo "host=$(echo $AUTH_SERVER | cut -d'@' -f2)" >> $GITHUB_OUTPUT
          else
            echo "username=root" >> $GITHUB_OUTPUT
            echo "host=$AUTH_SERVER" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Contabo VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.parse.outputs.host }}
          username: ${{ steps.parse.outputs.username }}
          password: ${{ secrets.AUTH_PASS }}
          command_timeout: 30m
          script: |
            set -e
            
            # 0. Limpiar imagenes viejas del proyecto y caché de construcción
            echo "Limpiando espacio en disco de imagenes viejas..."
            docker image prune -f || true
            docker builder prune -f || true
            
            # 1. Crear directorio del proyecto si no existe
            mkdir -p /root/backend-qhubomor
            cd /root/backend-qhubomor
            
            # 2. Clonar el repositorio o actualizarlo si ya existe
            if [ ! -d ".git" ]; then
              echo "Clonando repositorio por primera vez..."
              git clone https://${{ secrets.TOKEN_NESTQHUBOMOR }}@github.com/JhonnM62/backend-nest-js-qhubomor.git .
            else
              echo "Actualizando repositorio existente..."
              git remote set-url origin https://${{ secrets.TOKEN_NESTQHUBOMOR }}@github.com/JhonnM62/backend-nest-js-qhubomor.git
              git fetch --all
              git reset --hard origin/main
              git clean -fd
            fi
            
            # 3. Inyectar las variables de entorno desde los secretos de GitHub
            cat << 'EOF' > .env
            ${{ secrets.ENV_FILE_CONTENT }}
            EOF
            
            # 4. Construir la nueva imagen de Docker localmente en Contabo (sin cache para asegurar construccion limpia)
            echo "Construyendo imagen Docker..."
            docker build -t qhubomor-backend .
            
            # 5. Detener y eliminar el contenedor anterior si existe
            echo "Deteniendo contenedor anterior..."
            docker stop qhubomor-backend-app || true
            docker rm qhubomor-backend-app || true
            
            # 5.1 Crear directorios de subidas en el host para persistencia
            mkdir -p /root/backend-qhubomor/public/uploads/insumos
            mkdir -p /root/backend-qhubomor/public/uploads/gastos
            mkdir -p /root/backend-qhubomor/public/uploads/asistencia
            
            # 5.5 Aplicar migraciones/push de Prisma a la base de datos remotamente (sin borrar data)
            echo "Sincronizando esquema de base de datos..."
            docker run --rm --env-file .env qhubomor-backend npx prisma db push --accept-data-loss
            
            # 6. Levantar el nuevo contenedor mapeando el puerto y el volumen de persistencia
            echo "Levantando nuevo contenedor..."
            docker run -d \
              --name qhubomor-backend-app \
              -p 8061:3000 \
              -v /root/backend-qhubomor/public/uploads:/app/public/uploads \
              --restart unless-stopped \
              --env-file .env \
              qhubomor-backend
            
            echo "¡Despliegue completado exitosamente!"

            # =========================================================
            # FÁBRICA DE NUEVOS CLIENTES
            # Función reutilizable - la imagen ya fue construida arriba.
            # Para agregar un cliente: copia la última línea y cambia
            # los parámetros (CLIENT_ID, PUERTO, DOMINIO, SECRETO).
            # =========================================================
            deploy_new_client() {
              CLIENT_ID=$1
              PORT=$2
              DOMAIN=$3
              ENV_CONTENT=$4

              echo "🚀 Desplegando Backend para: $CLIENT_ID en $DOMAIN:$PORT"

              # Crear archivo .env exclusivo para este cliente
              printf '%s' "$ENV_CONTENT" > /root/backend-qhubomor/.env.$CLIENT_ID

              # Crear directorios de uploads exclusivos para este cliente
              mkdir -p /root/backend-qhubomor/public/uploads/$CLIENT_ID/insumos
              mkdir -p /root/backend-qhubomor/public/uploads/$CLIENT_ID/gastos
              mkdir -p /root/backend-qhubomor/public/uploads/$CLIENT_ID/asistencia

              # Detener y eliminar contenedor anterior de este cliente
              docker stop backend-$CLIENT_ID || true
              docker rm backend-$CLIENT_ID || true

              # Sincronizar esquema en la BD de este cliente (sin borrar datos)
              echo "Sincronizando BD para $CLIENT_ID..."
              docker run --rm \
                --env-file /root/backend-qhubomor/.env.$CLIENT_ID \
                qhubomor-backend \
                npx prisma db push --accept-data-loss

              # Levantar contenedor de este cliente (usa la imagen ya construida arriba)
              docker run -d \
                --name backend-$CLIENT_ID \
                -p $PORT:3000 \
                -v /root/backend-qhubomor/public/uploads/$CLIENT_ID:/app/public/uploads \
                --restart unless-stopped \
                --env-file /root/backend-qhubomor/.env.$CLIENT_ID \
                qhubomor-backend

              # Configurar subdominio + certificado SSL automáticamente
              DOMAIN=$DOMAIN PORT=$PORT EMAIL=jonnymejia62@gmail.com \
                bash /root/n8n/scripts/setup-nginx.sh

              echo "✅ Cliente $CLIENT_ID desplegado en https://$DOMAIN"
            }

            # ----------------------------------------------------------
            # LISTA DE CLIENTES ACTIVOS
            # Para agregar uno nuevo: copia la línea de abajo,
            # cambia los valores y crea el secreto en GitHub.
            # ----------------------------------------------------------
            deploy_new_client \
              "restaurante2" \
              "8071" \
              "api-restaurante2.autosystemprojects.site" \
              "${{ secrets.ENV_BACKEND_RESTAURANTE2 }}"

